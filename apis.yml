aid: logiless
name: Logiless
description: >-
  LOGILESS (ロジレス) is a Japanese cloud EC logistics platform that unifies order
  management (OMS) and warehouse management (WMS) for e-commerce merchants —
  automating order intake from marketplaces and shopping carts (Rakuten, Shopify,
  ColorMe, futureshop, ec-force and more), inventory synchronization, allocation,
  shipping-label issuance and warehouse operations. LOGILESS exposes a RESTful,
  OAuth2-protected API (scoped per merchant) for reading and writing sales orders,
  outbound and inbound deliveries, sales returns, inter-warehouse transfers,
  articles (product master), multi-layer inventory summaries, warehouses, stores
  and suppliers. The company is a 500 Global portfolio company. This profile was
  enriched by the API Evangelist pipeline from LOGILESS's public developer
  documentation; the OpenAPI here is derived and not an official LOGILESS artifact.
